<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Product Card</title>
</head>

<body>
    <h1 class="product-page__title">Выбери свой продукт</h1>
    <div class="container">
        <div class="product-card">
            <img src="images/moisturizing-mousse.png" class="product-card__image" alt="moisturizing Mousse">
            <div class="product-card__content">
                <p class="product-card__category">для нормальной кожи</p>
                <h3 class="product-card__title">Увлажняющий мусс</h3>
                <p class="product-card__description">Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.</p>
                <span class="product-card__subtitle">Состав:</span>
                <ul class="product-card__list">
                    <li class="product-card__item">активные натуральные комплексы</li>
                    <li class="product-card__item">витамины С, А, РР, В и Е</li>
                    <li class="product-card__item">солнцезащитные компоненты</li>
                </ul>
                <div class="product-card__price-wrapper">
                    <span class="product-card__price-label">Цена</span>
                    <span class="product-card__price-value">2 750 &#8381;</span>
                </div>
            </div>
        </div>
        </div>
</body>
</html>
